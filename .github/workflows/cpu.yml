name: CPU numerical checks
on: [push, pull_request]
jobs:
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[test,fem]" -c requirements-repro.txt
      - run: python -m pytest tests -q
      - run: neb figures --output outputs/paper_figures
