[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eigenfluid"
version = "0.1.0"
description = "Geometry-conditioned Eigenfluid Net for spectral fluid bases and reduced dynamics"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.10",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "Pillow>=10",
  "scipy>=1.12",
  "scikit-fem>=11,<12",
  "torch>=2.5",
]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x>=13"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["cases/2D_Airfoil/src"]
include = ["eigenfluid*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
# Case-local packages share the eigenfluid namespace and are validated in
# isolated pytest processes; the README lists the complete case matrix.
testpaths = ["tests"]
