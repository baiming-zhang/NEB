[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "k96-moving-cylinder-pinn"
version = "1.0.0"
description = "GT-free K=96 moving-cylinder basis learning and NS reconstruction"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.10",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.12",
  "torch>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
