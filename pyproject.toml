[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-eigenfluid-bases"
version = "1.0.0"
description = "Continuous spectral coordinates for incompressible flow"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Baiming Zhang"}, {name = "Shiying Xiong"}, {name = "Zhecheng Wang"}]
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8", "psutil>=5.9", "Pillow>=10", "threadpoolctl>=3", "h5py>=3.10"]

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13"]
torch = ["torch>=2.5"]
fem = ["scikit-fem>=11", "meshpy>=2022", "meshio>=5", "gmsh>=4.12", "trimesh>=4", "scikit-image>=0.24"]
test = ["pytest>=8"]

[project.scripts]
neb = "neb.__main__:main"

[project.urls]
Repository = "https://github.com/baiming-zhang/NEB"

[tool.setuptools.packages.find]
where = ["src"]
